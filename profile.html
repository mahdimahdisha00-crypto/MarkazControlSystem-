<script>

/*
==============================================================
    MARKAZ CONTROL SYSTEM
    STUDENT PROFILES
==============================================================
*/


let students = [];


/* ==========================================================
   LOAD STUDENT DATA
========================================================== */

function loadProfiles() {

    const saved =
        localStorage.getItem("markaz_students");

    if (saved) {

        try {

            students = JSON.parse(saved);

        } catch (error) {

            students = [];

        }

    } else {

        students = [];

    }

    renderProfiles(students);

}


/* ==========================================================
   FILTER PROFILES
========================================================== */

function filterProfiles() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    const level =
        document
            .getElementById("levelFilter")
            .value;

    const status =
        document
            .getElementById("statusFilter")
            .value;


    const filtered =
        students.filter(student => {

            const searchableText = (

                (student.name || "") +
                " " +
                (student.id || "") +
                " " +
                (student.parentName || "") +
                " " +
                (student.parentPhone || "") +
                " " +
                (student.teacher || "")

            ).toLowerCase();


            const matchesSearch =
                searchableText.includes(search);


            const matchesLevel =
                !level ||
                student.level === level;


            const matchesStatus =
                !status ||
                student.status === status;


            return (
                matchesSearch &&
                matchesLevel &&
                matchesStatus
            );

        });


    renderProfiles(filtered);

}


/* ==========================================================
   RENDER PROFILE CARDS
========================================================== */

function renderProfiles(list) {

    const grid =
        document.getElementById("profilesGrid");

    grid.innerHTML = "";


    if (!list || list.length === 0) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    👨‍🎓
                </div>

                <h3>
                    No Student Profiles Found
                </h3>

                <p>
                    Add students from Student Management
                    to see their profiles here.
                </p>

                <button
                    class="refresh-btn"
                    onclick="location.href='students.html'"
                >
                    📚 Go to Student Management
                </button>

            </div>

        `;

        return;

    }


    list.forEach(student => {

        const card =
            document.createElement("div");

        card.className = "profile-card";


        const firstLetter =
            (student.name || "?")
                .charAt(0)
                .toUpperCase();


        const statusClass =
            student.status === "Active"
                ? "active"
                : "inactive";


        card.innerHTML = `

            <div class="profile-top">

                <div class="avatar">
                    ${firstLetter}
                </div>

                <div>

                    <div class="profile-name">
                        ${escapeHTML(student.name || "Unknown")}
                    </div>

                    <div class="profile-id">
                        ID: ${escapeHTML(student.id || "N/A")}
                    </div>

                    <span class="badge ${statusClass}">
                        ${escapeHTML(student.status || "Unknown")}
                    </span>

                </div>

            </div>


            <div class="detail">

                <span class="label">
                    Age
                </span>

                <span class="value">
                    ${escapeHTML(String(student.age || "N/A"))}
                </span>

            </div>


            <div class="detail">

                <span class="label">
                    Level / Class
                </span>

                <span class="value">
                    ${escapeHTML(student.level || "Not assigned")}
                </span>

            </div>


            <div class="detail">

                <span class="label">
                    Teacher
                </span>

                <span class="value">
                    ${escapeHTML(student.teacher || "Not assigned")}
                </span>

            </div>


            <div class="detail">

                <span class="label">
                    Parent
                </span>

                <span class="value">
                    ${escapeHTML(student.parentName || "Not provided")}
                </span>

            </div>


            <div class="detail">

                <span class="label">
                    Parent Phone
                </span>

                <span class="value">
                    ${escapeHTML(student.parentPhone || "Not provided")}
                </span>

            </div>


            <div class="card-actions">

                <button
                    class="action-btn view-btn"
                    onclick="viewFullProfile('${student.id}')"
                >
                    👁 View Profile
                </button>

                <button
                    class="action-btn edit-btn"
                    onclick="editStudent('${student.id}')"
                >
                    ✏️ Edit
                </button>

                <button
                    class="action-btn hifz-btn"
                    onclick="openHifz('${student.id}')"
                >
                    📖 Hifz
                </button>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* ==========================================================
   VIEW FULL PROFILE
========================================================== */

function viewFullProfile(id) {

    const student =
        students.find(
            item => item.id === id
        );


    if (!student) {

        alert("Student profile could not be found.");

        return;

    }


    const firstLetter =
        (student.name || "?")
            .charAt(0)
            .toUpperCase();


    const statusClass =
        student.status === "Active"
            ? "active"
            : "inactive";


    const history =
        getStudentHistory(student.id);


    document.getElementById(
        "fullProfileContent"
    ).innerHTML = `

        <div class="full-profile-header">

            <div class="large-avatar">
                ${firstLetter}
            </div>

            <div>

                <div class="full-name">
                    ${escapeHTML(student.name || "Unknown")}
                </div>

                <div>
                    Student ID:
                    <strong>
                        ${escapeHTML(student.id || "N/A")}
                    </strong>
                </div>

                <span class="badge ${statusClass}">
                    ${escapeHTML(student.status || "Unknown")}
                </span>

            </div>

        </div>


        <!-- PERSONAL INFORMATION -->

        <div class="section-title">
            👤 Personal Information
        </div>

        <div class="info-grid">

            <div class="info-item">

                <span class="label">
                    Full Name
                </span>

                <span class="value">
                    ${escapeHTML(student.name || "Not provided")}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Age
                </span>

                <span class="value">
                    ${escapeHTML(String(student.age || "Not provided"))}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Gender
                </span>

                <span class="value">
                    ${escapeHTML(student.gender || "Not provided")}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Enrollment Date
                </span>

                <span class="value">
                    ${escapeHTML(student.enrollmentDate || "Not provided")}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Address
                </span>

                <span class="value">
                    ${escapeHTML(student.address || "Not provided")}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Status
                </span>

                <span class="value">
                    ${escapeHTML(student.status || "Not provided")}
                </span>

            </div>

        </div>


        <!-- ACADEMIC INFORMATION -->

        <div class="section-title">
            📚 Academic Information
        </div>

        <div class="info-grid">

            <div class="info-item">

                <span class="label">
                    Level / Class
                </span>

                <span class="value">
                    ${escapeHTML(student.level || "Not assigned")}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Assigned Teacher
                </span>

                <span class="value">
                    ${escapeHTML(student.teacher || "Not assigned")}
                </span>

            </div>

        </div>


        <!-- PARENT INFORMATION -->

        <div class="section-title">
            👨‍👩‍👧 Parent / Guardian Information
        </div>

        <div class="info-grid">

            <div class="info-item">

                <span class="label">
                    Parent / Guardian Name
                </span>

                <span class="value">
                    ${escapeHTML(student.parentName || "Not provided")}
                </span>

            </div>


            <div class="info-item">

                <span class="label">
                    Phone Number
                </span>

                <span class="value">
                    ${escapeHTML(student.parentPhone || "Not provided")}
                </span>

            </div>

        </div>


        <!-- STUDENT HISTORY -->

        <div class="section-title">
            📜 Student History
        </div>

        ${history}


        <!-- NOTES -->

        <div class="section-title">
            📝 Notes
        </div>

        <div class="info-item">

            <span class="value">
                ${escapeHTML(student.notes || "No additional notes.")}
            </span>

        </div>

    `;


    document.getElementById(
        "profileModal"
    ).style.display = "block";

}


/* ==========================================================
   STUDENT HISTORY
========================================================== */

function getStudentHistory(studentId) {

    let history = [];


    /*
       HIFZ HISTORY
       Compatible with future localStorage data.
    */

    const savedHifz =
        localStorage.getItem("markaz_hifz");

    if (savedHifz) {

        try {

            const hifzRecords =
                JSON.parse(savedHifz);


            hifzRecords.forEach(record => {

                if (
                    record.studentId === studentId ||
                    record.student === studentId
                ) {

                    history.push({

                        date:
                            record.date || "N/A",

                        type:
                            "Hifz / Sabaq",

                        details:
                            (
                                (record.surah || "") +
                                " " +
                                (record.ayahFrom || "") +
                                "-" +
                                (record.ayahTo || "")
                            ),

                        result:
                            record.grade ||
                            record.performance ||
                            "N/A"

                    });

                }

            });

        } catch (error) {

            console.log(
                "Hifz history unavailable."
            );

        }

    }


    /*
       ATTENDANCE HISTORY
    */

    const savedAttendance =
        localStorage.getItem("markaz_attendance");

    if (savedAttendance) {

        try {

            const attendanceRecords =
                JSON.parse(savedAttendance);


            attendanceRecords.forEach(record => {

                if (
                    record.studentId === studentId ||
                    record.student === studentId
                ) {

                    history.push({

                        date:
                            record.date || "N/A",

                        type:
                            "Attendance",

                        details:
                            record.status || "N/A",

                        result:
                            record.remarks || ""

                    });

                }

            });

        } catch (error) {

            console.log(
                "Attendance history unavailable."
            );

        }

    }


    /*
       IF NO HISTORY
    */

    if (history.length === 0) {

        return `

            <div class="no-history">

                📜 No activity history available yet.

                <br><br>

                Hifz records and attendance records
                will appear here when those modules
                are connected to this student.

            </div>

        `;

    }


    /*
       SORT NEWEST FIRST
    */

    history.sort(
        (a, b) =>
            new Date(b.date) -
            new Date(a.date)
    );


    let html = `

        <div style="overflow-x:auto;">

            <table class="history-table">

                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Activity
                        </th>

                        <th>
                            Details
                        </th>

                        <th>
                            Result
                        </th>

                    </tr>

                </thead>

                <tbody>

    `;


    history.forEach(item => {

        html += `

            <tr>

                <td>
                    ${escapeHTML(item.date)}
                </td>

                <td>
                    ${escapeHTML(item.type)}
                </td>

                <td>
                    ${escapeHTML(item.details)}
                </td>

                <td>
                    ${escapeHTML(item.result)}
                </td>

            </tr>

        `;

    });


    html += `

                </tbody>

            </table>

        </div>

    `;


    return html;

}


/* ==========================================================
   EDIT STUDENT
========================================================== */

function editStudent(id) {

    /*
       Student Management remains responsible for editing.
    */

    window.location.href =
        "students.html?edit=" +
        encodeURIComponent(id);

}


/* ==========================================================
   OPEN HIFZ
========================================================== */

function openHifz(id) {

    window.location.href =
        "hifz.html?student=" +
        encodeURIComponent(id);

}


/* ==========================================================
   CLOSE PROFILE MODAL
========================================================== */

function closeProfile() {

    document.getElementById(
        "profileModal"
    ).style.display = "none";

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


/* ==========================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================== */

window.onclick = function(event) {

    const modal =
        document.getElementById("profileModal");

    if (event.target === modal) {

        closeProfile();

    }

};


/* ==========================================================
   INITIALIZE
========================================================== */

loadProfiles();

</script>
