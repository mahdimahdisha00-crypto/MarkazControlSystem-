<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markaz Control System Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#0b4f8a;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.status{
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#0b4f8a;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#083b67;
}

.roles{
    margin-top:20px;
    text-align:center;
    color:#555;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:13px;
}

</style>
</head>
<body>

<div class="login-box">

    <h1>Markaz Control System</h1>

    <div class="subtitle">
        Quran Memorization Center Management
    </div>

    <div id="serverStatus" class="status">
        Checking Server...
    </div>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        Sign In
    </button>

    <div class="roles">
        👑 Administrator &nbsp;
        👔 Manager &nbsp;
        👨‍🏫 Teacher
    </div>

    <div class="footer">
        © 2026 Markaz Control System
    </div>

</div>

<script>

async function checkServer(){

    try{

        const response =
        await fetch("/api/status");

        if(response.ok){

            document.getElementById(
                "serverStatus"
            ).innerHTML =
            "✅ Server Connected";

        }else{

            document.getElementById(
                "serverStatus"
            ).innerHTML =
            "❌ Server Error";

        }

    }catch(error){

        document.getElementById(
            "serverStatus"
        ).innerHTML =
        "❌ Cannot Connect To Server";

    }

}

async function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    try{

        const response =
        await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password
            })
        });

        const data =
        await response.json();

        if(data.success){

            localStorage.setItem(
                "role",
                data.role
            );

            alert(
                "Login Successful"
            );

            window.location.href =
            "dashboard.html";

        }else{

            alert(
                data.message ||
                "Invalid Username Or Password"
            );

        }

    }catch(error){

        alert(
            "Cannot connect to login server."
        );

    }

}

checkServer();

</script>

</body>
</html>
