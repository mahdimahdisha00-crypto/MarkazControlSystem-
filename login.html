<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Markaz Control System - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(135deg, rgba(8, 48, 107, 0.96), rgba(16, 94, 145, 0.92)),
                #0b4f8a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #0b4f8a, #159957);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 10px 25px rgba(11, 79, 138, 0.25);
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #12304a;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin: 8px 0 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d9e2ec;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #0b70b7;
            box-shadow: 0 0 0 3px rgba(11, 112, 183, 0.10);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .login-button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0b4f8a, #159957);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(11, 79, 138, 0.25);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        .role-info {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .role {
            padding: 6px 10px;
            border-radius: 20px;
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
        }

        .loading {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            📖
        </div>

        <h1>Markaz Control System</h1>

        <div class="subtitle">
            Quran Memorization Center Management
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >
                        👁️
                    </button>

                </div>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign In
            </button>

        </form>

        <div class="role-info">
            <span class="role">👑 Administrator</span>
            <span class="role">👔 Manager</span>
            <span class="role">👨‍🏫 Teacher</span>
        </div>

        <div class="footer">
            © 2026 Markaz Control System
        </div>

    </div>

</div>

<script>

function togglePassword() {

    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}


function showMessage(message, type) {

    const box = document.getElementById("message");

    box.textContent = message;

    box.className = "message " + type;
}


document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginButton");

    if (!username || !password) {

        showMessage(
            "Please enter your username and password.",
            "error"
        );

        return;
    }

    button.disabled = true;

    button.innerHTML =
        '<span class="loading"></span>Signing in...';

    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })

        });

        const data = await response.json();

        if (!response.ok) {

            showMessage(
                data.message || "Login failed.",
                "error"
            );

            button.disabled = false;

            button.textContent = "Sign In";

            return;
        }

        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );

        /*
         * Save the logged-in user temporarily.
         * The server authentication will be added next.
         */

        sessionStorage.setItem(
            "markazUser",
            JSON.stringify(data.user)
        );

        setTimeout(function() {

            window.location.href = "/dashboard.html";

        }, 700);

    } catch (error) {

        console.error(error);

        showMessage(
            "Cannot connect to the Markaz server.",
            "error"
        );

        button.disabled = false;

        button.textContent = "Sign In";
    }

});

</script>

</body>
</html>
