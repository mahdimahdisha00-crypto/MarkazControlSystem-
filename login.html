<!DOCTYPE html>
<html>
<head>
    <title>Markaz Control System Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#0b4f8a;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#0b4f8a;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#083b67;
        }

        .status{
            text-align:center;
            margin-bottom:15px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2>Markaz Control System</h2>

    <div id="serverStatus" class="status">
        Checking server...
    </div>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        Sign In
    </button>

</div>

<script>

async function checkServer(){

    try{

        const response =
        await fetch("/api/status");

        const data =
        await response.json();

        document.getElementById(
            "serverStatus"
        ).innerHTML =
        "✅ Server Connected";

    }catch(error){

        document.getElementById(
            "serverStatus"
        ).innerHTML =
        "❌ Cannot connect to server";

    }

}

async function login(){

    alert(
        "Login API not added yet."
    );

}

checkServer();

</script>

</body>
</html>
