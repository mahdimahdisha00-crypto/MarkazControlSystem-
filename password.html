<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Password Change</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

.container{
    background:white;
    max-width:500px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
    color:#2563eb;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    border-radius:5px;
}
</style>

</head>
<body>

<div class="container">

<h1>🔐 Change Password</h1>

<input type="password" id="oldPassword" placeholder="Current Password">

<input type="password" id="newPassword" placeholder="New Password">

<button onclick="changePassword()">
Update Password
</button>

<p id="result"></p>

</div>

<script>

function changePassword(){

    const oldPass =
    document.getElementById("oldPassword").value;

    const newPass =
    document.getElementById("newPassword").value;

    if(oldPass === "" || newPass === ""){
        alert("Fill all fields");
        return;
    }

    document.getElementById("result").innerHTML =
    "Password updated successfully";

}

</script>

</body>
</html>
